[package]
name = "pacioliscube-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
pacioliscube = { path = ".." }

# A separate workspace, so the engine's own build never compiles the fuzzer.
[workspace]
members = ["."]

[[bin]]
name = "rules_parser"
path = "fuzz_targets/rules_parser.rs"
test = false
doc = false
bench = false
