# Opengrep's subprocess, eval and permission audit rules fire on test fixtures
# and fuzz harnesses that run argument-list commands and set file modes on
# purpose.
#
# Lizard and Prospector measure function and file size and complexity. Tests
# are long by design, one case per assertion block, and Cargo.lock files and
# the generated Unicode tables are generated, so neither is measured;
# production code still is.
engines:
  opengrep:
    exclude_paths:
      - "tests/**"
      - "**/tests/**"
      - "fuzz/**"
  lizard:
    exclude_paths:
      - "tests/**"
      - "**/tests/**"
      - "fuzz/**"
      - "Cargo.lock"
      - "**/Cargo.lock"
      - "src/pyunicode.rs"
  prospector:
    exclude_paths:
      - "tests/**"
      - "**/tests/**"
      - "fuzz/**"
