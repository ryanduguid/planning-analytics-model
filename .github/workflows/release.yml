name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    uses: ryanduguid/release-policy/.github/workflows/release-python.yml@3ba1bb8f8b656c1aaa7570e69f5a6f731c6f20ab
    with:
      upload-dist-artifact: true

  pypi:
    name: publish to PyPI
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/pacioliscube
    permissions:
      id-token: write # Obtain the OIDC identity that PyPI trusted publishing verifies.
    steps:
      - name: Download the exact distribution the release job attested
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ needs.release.outputs.stem }}-${{ needs.release.outputs.version }}
          path: dist

      - name: Require exactly one wheel and one source distribution
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -name '*.whl' | wc -l)" = "1"
          test "$(find dist -name '*.tar.gz' | wc -l)" = "1"
          ls -l dist

      - name: Publish to PyPI via trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
