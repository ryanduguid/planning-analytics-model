name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# The engine ships as source: release-policy's source-archive family builds
# deterministic ZIP and tar.gz archives of the tagged commit, an SPDX SBOM,
# SHA256SUMS and a signed provenance bundle. It runs no consumer build, so no
# job that can write executes this repository's code. Users build the binary
# with `cargo install --locked --path .` from the archive or a clone.
jobs:
  release:
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    uses: ryanduguid/release-policy/.github/workflows/release-archive.yml@a601f1d8b143f92b0517f709216993660d21f480
    with:
      artifact-stem: pacioliscube
      required-checks: |
        .github/workflows/no-ai-attribution.yml: Attribution policy / Attribution policy runner
        .github/workflows/ci.yml: dependency-audit
        .github/workflows/ci.yml: lint
        .github/workflows/ci.yml: package
        .github/workflows/ci.yml: test (ubuntu-latest)
        .github/workflows/ci.yml: test (windows-latest)
        .github/workflows/ci.yml: tests-gates
        .github/workflows/codeql.yml: analyse
        .github/workflows/codeql.yml: codeql-gates
