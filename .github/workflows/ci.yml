name: tests

on:
  push:
    branches: [main]
  pull_request:
  # The weekly run gives the fuzzer time on main even when nothing merges.
  schedule:
    - cron: "43 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI follows maintenance releases; local development pins the patch.
env:
  UV_PYTHON: "3.14"

jobs:
  lint:
    env:
      UV_PYTHON: "3.15"
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.15"
          allow-prereleases: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.5"
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          prune-cache: true
      - run: uv run --locked --extra dev ruff check pacioliscube tests  # NOSONAR: unprivileged job; uv installs the hash-locked set
      - run: uv run --locked --extra dev mypy pacioliscube  # NOSONAR: unprivileged job; uv installs the hash-locked set

  test:
    env:
      UV_PYTHON: "${{ matrix.python }}"
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    needs: lint
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.14"   # the declared floor and coverage producer
            fetch_depth: 0
          - os: ubuntu-latest
            python: "3.15"
            fetch_depth: 1
          - os: windows-latest
            python: "3.14"   # where path handling and the ANSI code page diverge
            fetch_depth: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: ${{ matrix.fetch_depth }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.5"
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          prune-cache: true
      - name: run tests
        if: matrix.os != 'ubuntu-latest' || matrix.python != '3.14'
        run: uv run --locked --extra dev --python ${{ matrix.python }} pytest -q
      - name: run tests with whole-package branch coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: >-
          uv run --locked --extra dev --python ${{ matrix.python }}
          coverage run --branch --source=pacioliscube -m pytest -q
      - name: require complete changed-line coverage in validation logic
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: |
          uv run --locked --extra dev --python ${{ matrix.python }} coverage xml --include="pacioliscube/validate.py" -o coverage.xml
          uv run --locked --extra dev --python ${{ matrix.python }} diff-cover coverage.xml --compare-branch=origin/main --branch-coverage --fail-under=100
      - name: require complete package coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: uv run --locked --extra dev --python ${{ matrix.python }} coverage report --fail-under=100  # NOSONAR: reads the coverage data only
      - name: write whole-package coverage for Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: uv run --locked --extra dev --python ${{ matrix.python }} coverage xml -o coverage-codecov.xml
      - name: keep the coverage report for the Codecov upload
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-codecov
          path: coverage-codecov.xml
          retention-days: 1

  # The upload runs apart from the tests so the OIDC token is never available
  # while test code runs. It is exempt from tests-gates: a Codecov outage must
  # not block merges.
  codecov:
    name: upload coverage to Codecov
    needs: test
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Authenticate the Codecov upload with OIDC; no stored token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-codecov
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage-codecov.xml
          disable_search: true
          fail_ci_if_error: true

  dependency-audit:
    env:
      UV_PYTHON: "3.15"
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.15"
          allow-prereleases: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.5"
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          prune-cache: true
      - run: uv run --locked --extra dev --with "pip-audit==2.10.1" pip-audit --local --strict  # NOSONAR: unprivileged read-only audit job

  package:
    env:
      UV_PYTHON: "3.15"
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.15"
          allow-prereleases: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.5"
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          prune-cache: true
      - run: uv build
      # Run away from the checkout so missing package data cannot be hidden by model/.
      - name: install the wheel into a clean environment and run the real command line
        run: |
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/pip install --no-index dist/pacioliscube-*.whl
          mkdir -p /tmp/wheel-consumer && cd /tmp/wheel-consumer
          test "$(/tmp/wheelenv/bin/pacioliscube demo)" = \
            "PnL:FY2026-27,Budget,Jul,CivilCo,All Cost Centres,Gross Margin,Amount = 1652100"
      # An sdist missing tests or fixtures still passes a source checkout run,
      # so the shipped tests are run from the extracted sdist as well.
      - name: run the shipped tests out of the sdist
        run: |
          mkdir -p /tmp/sdist && tar -xzf dist/*.tar.gz -C /tmp/sdist --strip-components=1
          python -m venv /tmp/sdistenv
          /tmp/sdistenv/bin/pip install --require-hashes --requirement requirements-sdist-test.txt
          cd /tmp/sdist && /tmp/sdistenv/bin/python -m pytest -q

  tm1git-conformance:
    # tm1gitpy, a TM1 Git reimplementation, must read model/ the way the engine
    # does. The environment variable turns the test's skip into a failure, so
    # a missing tm1gitpy cannot pass for agreement.
    needs: lint
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.5"
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          prune-cache: true
      - name: compare the engine with tm1gitpy on model/
        env:
          PACIOLISCUBE_REQUIRE_TM1GITPY: "1"
        run: uv run --locked --extra dev --group tm1git --python 3.14 pytest -q tests/test_tm1_source_form.py  # NOSONAR: unprivileged job; uv installs the hash-locked set

  fuzzing:
    name: fuzz the rules parser
    # A 60-second random exploration is not a repeatable merge gate, so it
    # runs after merge, weekly and on demand rather than on pull requests.
    if: github.event_name != 'pull_request'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # `python -m` from the checkout root imports pacioliscube from the source
      # tree, so the package itself needs no install.
      - name: Install the pinned fuzzer
        run: |
          python -m pip install --require-hashes --only-binary :all: --requirement requirements-fuzz.txt
      - name: Fuzz the rules parser
        run: >-
          python -m fuzz.rules_parser fuzz/corpus
          -max_total_time=60 -max_len=4096 -timeout=2 -rss_limit_mb=1024

  tests-gates:
    # The one context branch protection requires from this workflow. It fails
    # unless every job it needs succeeded, when a job in this file is missing
    # from needs, or when a pull request removes a job without adding a
    # "# removed-jobs: <job>" comment to this file.
    needs: [lint, test, dependency-audit, package, tm1git-conformance]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit's first parent holds the base branch's workflow.
          fetch-depth: 2
          sparse-checkout: .github
      - name: Require every job to be listed, kept and successful
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/ci/check_gates.py .github/workflows/ci.yml tests-gates --exempt codecov --exempt fuzzing
