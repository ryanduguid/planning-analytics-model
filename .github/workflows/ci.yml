name: tests

on:
  push:
    branches: [main]
  pull_request:
  # The weekly run gives the fuzzer time on main even when nothing merges.
  schedule:
    - cron: "43 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The engine's toolchain is pinned in rust-toolchain.toml.
env:
  CARGO_TERM_COLOR: never
  RUST_TOOLCHAIN: "1.99"

jobs:
  lint:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint the engine, its tests and its benchmark
        run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    needs: lint
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Windows is where path handling, CRLF output and the console differ.
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Run the tests
        if: matrix.os != 'ubuntu-latest'
        run: cargo test --locked
      - name: Run the tests with line coverage
        if: matrix.os == 'ubuntu-latest'
        run: |
          rustup component add llvm-tools-preview --toolchain "$RUST_TOOLCHAIN"
          cargo install cargo-llvm-cov --locked --version 0.9.1
          cargo llvm-cov --locked --lcov --output-path coverage-codecov.lcov --fail-under-lines 90
      - name: Keep the coverage report for the Codecov upload
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-codecov
          path: coverage-codecov.lcov
          retention-days: 1

  # The upload runs apart from the tests so the OIDC token is never available
  # while test code runs. It is exempt from tests-gates: a Codecov outage must
  # not block merges.
  codecov:
    name: upload coverage to Codecov
    needs: test
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Authenticate the Codecov upload with OIDC; no stored token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-codecov
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage-codecov.lcov
          disable_search: true
          fail_ci_if_error: true

  dependency-audit:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain and auditor
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          cargo install cargo-audit --locked --version 0.22.2
      # Both locks: the engine's and the fuzzer's.
      - name: Audit the locked dependencies against the RustSec database
        run: |
          cargo audit --deny warnings --file Cargo.lock
          cargo audit --deny warnings --file fuzz/Cargo.lock

  package:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      # A release binary that builds but cannot read its own model tree is a
      # broken build artefact, so the real command line runs against the real
      # model here, from a directory outside the checkout.
      - name: Build and install the release binary, then run it on the shipped model
        run: |
          cargo install --locked --path . --root "$RUNNER_TEMP/install"
          cp -r model examples "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          install/bin/pacioliscube --version
          install/bin/pacioliscube validate model
          install/bin/pacioliscube report model --data examples --year FY2026-27 --version Budget
          # The demo must work from its bundled inputs alone, so run it where no model tree is.
          mkdir demo-consumer && cd demo-consumer
          test "$(../install/bin/pacioliscube demo)" = \
            "PnL:FY2026-27,Budget,Jul,CivilCo,All Cost Centres,Gross Margin,Amount = 1652100"

  tm1git-conformance:
    # tm1gitpy, a TM1 Git reimplementation, must read model/ the way the engine
    # does. It writes its reading of the model as JSON, which a Rust test
    # compares with the engine's; the environment variable turns that test's
    # skip into a failure, so a missing tm1gitpy cannot pass for agreement.
    needs: lint
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      # Every file is hash pinned. mdxpy publishes only a source distribution,
      # so source builds stay allowed; this job holds no write permission.
      - name: Install the pinned tm1gitpy
        run: |
          python -m venv "$RUNNER_TEMP/tm1git"
          "$RUNNER_TEMP/tm1git/bin/pip" install --disable-pip-version-check --no-deps --require-hashes --requirement ci/requirements-tm1git.txt
      - name: Read model/ with tm1gitpy
        run: |
          mkdir -p "$RUNNER_TEMP/tm1git-cache"
          cd "$RUNNER_TEMP/tm1git-cache"
          "$RUNNER_TEMP/tm1git/bin/python" "$GITHUB_WORKSPACE/ci/tm1gitpy_model.py" "$GITHUB_WORKSPACE/model" "$RUNNER_TEMP/tm1gitpy-model.json"
      - name: Install the pinned toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Compare the engine with tm1gitpy on model/
        env:
          PACIOLISCUBE_REQUIRE_TM1GITPY: "1"
        run: PACIOLISCUBE_TM1GITPY_JSON="$RUNNER_TEMP/tm1gitpy-model.json" cargo test --locked --test model tm1gitpy

  fuzzing:
    name: fuzz the rules parser
    # A 60-second random exploration is not a repeatable merge gate, so it
    # runs after merge, weekly and on demand rather than on pull requests.
    if: github.event_name != 'pull_request'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # libFuzzer instrumentation needs a nightly compiler; the date is pinned.
      - name: Install the pinned fuzzer
        run: |
          rustup toolchain install nightly-2026-10-15 --profile minimal
          cargo install cargo-fuzz --locked --version 0.13.2
      - name: Fuzz the rules parser
        run: >-
          cargo +nightly-2026-10-15 fuzz run rules_parser fuzz/corpus --
          -max_total_time=60 -max_len=4096 -timeout=2 -rss_limit_mb=1024

  tests-gates:
    # The one context branch protection requires from this workflow. It fails
    # unless every job it needs succeeded, when a job in this file is missing
    # from needs, or when a pull request removes a job without adding a
    # "# removed-jobs: <job>" comment to this file.
    needs: [lint, test, dependency-audit, package, tm1git-conformance]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit's first parent holds the base branch's workflow.
          fetch-depth: 2
          sparse-checkout: .github
      - name: Require every job to be listed, kept and successful
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 .github/ci/check_gates.py .github/workflows/ci.yml tests-gates --exempt codecov --exempt fuzzing
