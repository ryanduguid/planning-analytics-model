version: 2
updates:
  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/fuzz"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # One weekly PR for both locks: each separate bump otherwise needs its own
    # update-branch round under strict branch protection.
    groups:
      rust-dependencies:
        patterns:
          - "*"

  # tm1gitpy and its dependencies for the conformance job.
  - package-ecosystem: "pip"
    directory: "/ci"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      tm1git:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # One group for every action. It also keeps CodeQL's init and analyze
      # together: they are separate dependencies to Dependabot, and a job
      # running one release against the other's config fails outright.
      github-actions:
        patterns:
          - "*"
    ignore:
      # ADR-0001: the release-policy pin is an immutable full commit SHA,
      # advanced only by a reviewed migration that also updates the pin
      # assertion. Dependabot bumps fail the POLICY pin test and add
      # unapproved SHAs to the portfolio audit, so re-pin by hand instead.
      - dependency-name: "ryanduguid/release-policy/.github/workflows/*"
