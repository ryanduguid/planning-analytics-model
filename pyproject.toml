[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "pacioliscube"
version = "0.2.0"
description = "An open IBM Planning Analytics budgeting model with an offline engine that computes and tests it."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Ryan Duguid" }]
keywords = ["tm1", "planning-analytics", "budgeting", "fpa", "australia"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ryanduguid/planning-analytics-model"
Issues = "https://github.com/ryanduguid/planning-analytics-model/issues"

[project.scripts]
pacioliscube = "pacioliscube.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff==0.16.10",
    "mypy==2.4.0",
    "hypothesis==6.168.4",
    "mutmut==3.8.0",
    "coverage==7.16.2",
    "diff-cover==10.6.0",
    "build>=1.6.0",
    # release-python builds without isolation, so the backend comes from this
    # locked extra, pinned exactly as [build-system] requires.
    "hatchling==1.32.4",
]

[dependency-groups]
# Test-only and never shipped: the CI job tm1git-conformance loads model/ with
# tm1gitpy, a TM1 Git reimplementation, and compares it with this engine
# (tests/test_tm1_source_form.py). A dependency group stays out of the wheel's
# metadata, which an optional extra would not.
tm1git = [
    "tm1gitpy==1.2.10",
]

[tool.hatch.build.targets.wheel]
packages = ["pacioliscube"]

[tool.hatch.build.targets.sdist]
include = [
    "/benchmarks",
    "/pacioliscube",
    "/tests",
    "/fuzz",
    "/model",
    "/examples",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py314"
line-length = 100
# The roots import sorting resolves a module name against, so the package and
# the tests' own conftest sort as first party rather than as dependencies.
src = [".", "tests"]

[tool.ruff.lint]
# Import errors (E4), statement errors (E7), syntax errors (E9), the whole of
# pyflakes (F) and import sorting (I). Line length is set above and is not
# enforced as a lint, because wrapping a long error message mid sentence costs
# more in reading than it gains.
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.14"
packages = ["pacioliscube"]
ignore_missing_imports = true
pretty = true

[tool.mutmut]
source_paths = ["pacioliscube/"]
only_mutate = ["pacioliscube/evaluate.py"]
pytest_add_cli_args_test_selection = ["tests/test_evaluate.py", "tests/test_properties.py"]

[tool.coverage.report]
# A module's entry guard only calls main(), which the tests call directly.
exclude_also = ['if __name__ == "__main__":']
