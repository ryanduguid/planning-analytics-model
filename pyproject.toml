[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pacioliscube"
version = "0.1.1"
description = "An open IBM Planning Analytics budgeting model with an offline engine that computes and tests it."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ryan Duguid" }]
keywords = ["tm1", "planning-analytics", "budgeting", "fpa", "australia"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ryanduguid/planning-analytics-model"
Issues = "https://github.com/ryanduguid/planning-analytics-model/issues"

[project.scripts]
pacioliscube = "pacioliscube.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff==0.16.6",
    "mypy==2.3.1",
    "hypothesis==6.167.1",
    "mutmut==3.7.0",
    "coverage==7.16.0",
    "diff-cover==10.5.1",
    "build>=1.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["pacioliscube"]

[tool.hatch.build.targets.sdist]
include = [
    "/pacioliscube",
    "/tests",
    "/model",
    "/examples",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
# The roots import sorting resolves a module name against, so the package and
# the tests' own conftest sort as first party rather than as dependencies.
src = [".", "tests"]

[tool.ruff.lint]
# Import errors (E4), statement errors (E7), syntax errors (E9), the whole of
# pyflakes (F) and import sorting (I). Line length is set above and is not
# enforced as a lint, because wrapping a long error message mid sentence costs
# more in reading than it gains.
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
packages = ["pacioliscube"]
ignore_missing_imports = true
pretty = true

[tool.mutmut]
source_paths = ["pacioliscube/"]
only_mutate = ["pacioliscube/evaluate.py"]
pytest_add_cli_args_test_selection = ["tests/test_evaluate.py", "tests/test_properties.py"]
