# Local gates, matching the lint and test jobs of .github/workflows/ci.yml.
#
# Every hook runs the command the workflow runs, through the toolchain pinned
# in rust-toolchain.toml and the locked dependencies, so a hook that passes
# here cannot fail there on a version difference. `cargo` must be on PATH;
# rustup installs the pinned toolchain on first use.
#
#   pip install pre-commit && pre-commit install
#   pre-commit install --hook-type commit-msg
#   pre-commit run --all-files

repos:
  - repo: local
    hooks:
      - id: rustfmt
        name: format the engine
        entry: cargo fmt --check
        language: system
        pass_filenames: false
        types_or: [rust, toml]

      - id: clippy
        name: lint the engine
        entry: cargo clippy --locked --all-targets -- -D warnings
        language: system
        pass_filenames: false
        types_or: [rust, toml]

      - id: cargo-test
        name: engine tests
        entry: cargo test --locked
        language: system
        pass_filenames: false

      - id: validate-model
        name: the shipped model validates
        entry: cargo run --locked --quiet -- validate model
        language: system
        pass_filenames: false

  - repo: local
    hooks:
      - id: no-ai-attribution
        name: refuse AI authorship credit
        # Install the commit-msg stage too: `pre-commit install --hook-type commit-msg`.
        entry: .githooks/commit-msg
        language: script
        stages: [commit-msg]
