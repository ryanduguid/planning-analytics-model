# Local git hooks. Install once with `pre-commit install`. Ruff is pinned to
# the version CI runs, so a commit that passes here passes the lint gate.
# No format hook: CI checks nothing that ruff format would rewrite.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff

  - repo: local
    hooks:
      - id: no-ai-attribution
        name: refuse AI authorship credit
        # Install the commit-msg stage too: `pre-commit install --hook-type commit-msg`.
        entry: .githooks/commit-msg
        language: script
        stages: [commit-msg]
